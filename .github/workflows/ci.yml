name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tenet_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tenet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run test
        env:
          TEST_DATABASE_URL: postgres://tenet_test:test_password@localhost:5432/tenet_test
      - run: bun run build
      - run: bun run typecheck
      - name: Check generated routes are committed
        run: git diff --exit-code -- apps/dashboard/src/routeTree.gen.ts apps/website/src/routeTree.gen.ts

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Real daemon enrollment and telemetry
        run: TENET_DAEMON_TEST_BINARY="$PWD/target/debug/tenetd" bun test packages/api/test/machines.test.ts
      - name: Build Linux updater integration fixture
        run: |
          bun run bundle:daemon x86_64
          docker build --platform linux/amd64 -t tenet-updater-test -f deploy/daemon/test.Dockerfile .
      - name: Linux signed update and rollback integration
        run: TENET_TEST_LINUX_UPDATER=1 bun test packages/api/test/updater-linux.test.ts
